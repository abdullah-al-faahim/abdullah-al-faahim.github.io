<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pantone code to ink formula"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">From a code to a mixed ink</text><line x1="80" y1="210" x2="1120" y2="210" stroke="#1e066f" stroke-width="4" stroke-linecap="round"/><circle cx="140" cy="210" r="14" fill="#6b4aff" stroke="#1e066f" stroke-width="3"/><text x="140" y="175" font-size="24" fill="#6b4aff" font-weight="800" text-anchor="middle" letter-spacing="0">1962</text><text x="140" y="250" font-size="17" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Herbert buys the company</text><circle cx="420" cy="210" r="14" fill="#d4ff24" stroke="#1e066f" stroke-width="3"/><text x="420" y="175" font-size="24" fill="#6b4aff" font-weight="800" text-anchor="middle" letter-spacing="0">1963</text><text x="420" y="250" font-size="17" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Matching System launched</text><circle cx="720" cy="210" r="14" fill="#6b4aff" stroke="#1e066f" stroke-width="3"/><text x="720" y="175" font-size="24" fill="#6b4aff" font-weight="800" text-anchor="middle" letter-spacing="0">Later</text><text x="720" y="250" font-size="17" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Fashion, plastics, digital</text><circle cx="1040" cy="210" r="14" fill="#6b4aff" stroke="#1e066f" stroke-width="3"/><text x="1040" y="175" font-size="24" fill="#6b4aff" font-weight="800" text-anchor="middle" letter-spacing="0">Today</text><text x="1040" y="250" font-size="17" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Guides + digital tools</text><rect x="60" y="320" width="300" height="280" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="84" y="344" width="252" height="150" rx="10" fill="#2a5cd6" stroke="#2a5cd6" stroke-width="0"/><text x="84" y="534" font-size="20" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">PANTONE 2935 C</text><text x="84" y="566" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">code + paper suffix</text><line x1="380" y1="460" x2="470" y2="460" stroke="#6b4aff" stroke-width="5" stroke-linecap="round"/><path d="M456.0 467.7 L470 460 L456.0 452.3" fill="none" stroke="#6b4aff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="490" y="340" width="46" height="46" rx="10" fill="#1f3fc9" stroke="#1f3fc9" stroke-width="2"/><text x="556" y="370" font-size="20" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Base blue</text><rect x="780" y="352" width="288" height="22" rx="11" fill="#6b4aff" stroke="none" stroke-width="0"/><text x="1078" y="371" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">9 parts</text><rect x="490" y="404" width="46" height="46" rx="10" fill="#00a3e0" stroke="#00a3e0" stroke-width="2"/><text x="556" y="434" font-size="20" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Base cyan</text><rect x="780" y="416" width="96" height="22" rx="11" fill="#6b4aff" stroke="none" stroke-width="0"/><text x="886" y="435" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">3 parts</text><rect x="490" y="468" width="46" height="46" rx="10" fill="#eef2f8" stroke="#1e066f" stroke-width="2"/><text x="556" y="498" font-size="20" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Transparent white</text><rect x="780" y="480" width="128" height="22" rx="11" fill="#6b4aff" stroke="none" stroke-width="0"/><text x="918" y="499" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">4 parts</text><rect x="490" y="532" width="46" height="46" rx="10" fill="#111" stroke="#111" stroke-width="2"/><text x="556" y="562" font-size="20" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Black</text><rect x="780" y="544" width="32" height="22" rx="11" fill="#6b4aff" stroke="none" stroke-width="0"/><text x="822" y="563" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">1 parts</text><text x="490" y="620" font-size="15" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0" font-style="italic">Illustrative formula, not an official recipe</text></g></svg>