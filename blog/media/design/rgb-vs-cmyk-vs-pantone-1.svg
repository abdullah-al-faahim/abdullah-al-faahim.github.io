<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="RGB, CMYK and spot colour"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Three ways to make colour</text><text x="200" y="180" font-size="24" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">RGB: add light</text><rect x="60" y="200" width="280" height="250" rx="20" fill="#14112b" stroke="#14112b" stroke-width="3"/><circle cx="170" cy="295" r="70" fill="#ff2d2d" fill-opacity=".9" style="mix-blend-mode:screen"/><circle cx="230" cy="295" r="70" fill="#2dff5a" fill-opacity=".9" style="mix-blend-mode:screen"/><circle cx="200" cy="345" r="70" fill="#2d6bff" fill-opacity=".9" style="mix-blend-mode:screen"/><rect x="60" y="470" width="280" height="120" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="200" y="540" font-size="18" fill="#1e066f" font-weight="600" text-anchor="middle" letter-spacing="0">Screens emit light</text><text x="600" y="180" font-size="24" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">CMYK: layer ink</text><circle cx="570" cy="300" r="85" fill="#00aeef" fill-opacity=".55" style="mix-blend-mode:multiply"/><circle cx="630" cy="300" r="85" fill="#ec008c" fill-opacity=".55" style="mix-blend-mode:multiply"/><circle cx="600" cy="350" r="85" fill="#fff200" fill-opacity=".55" style="mix-blend-mode:multiply"/><rect x="460" y="470" width="280" height="120" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="600" y="540" font-size="14" fill="#1e066f" font-weight="600" text-anchor="middle" letter-spacing="0">Paper reflects what ink doesn&#x27;t absorb</text><text x="1000" y="180" font-size="24" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Spot: one mixed ink</text><rect x="890" y="230" width="220" height="200" rx="20" fill="#e4002b" stroke="#e4002b" stroke-width="3"/><text x="1000" y="340" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="2" font-family="Cascadia Mono, Consolas, Menlo, monospace">PRE-MIXED</text><rect x="860" y="470" width="280" height="120" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="1000" y="540" font-size="16" fill="#1e066f" font-weight="600" text-anchor="middle" letter-spacing="0">Exact, consistent, can be metallic</text></g></svg>