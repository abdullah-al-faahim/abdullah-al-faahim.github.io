)"><text x="0" y="0" font-size="11.200000000000001" font-weight="900" fill="#1e066f" letter-spacing="1" font-style="normal">Maison Lumière</text></g><text x="30" y="300" font-size="18" fill="#19b36b" font-weight="600" text-anchor="start" letter-spacing="0">Still readable, but less distinctive</text></g><rect x="636" y="104" width="167.5" height="30" rx="15" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="719.75" y="124.7" font-size="15" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">BOLD SANS-SERIF</text></g></svg>