<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Colour gamut comparison"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Colour gamuts, simplified</text><text x="48" y="108" font-size="20" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Each triangle is the range of colours a profile can describe</text><g transform="translate(40 20)"><path d="M250 600 C170 560 120 420 150 300 C175 200 230 120 290 95 C330 80 360 110 420 180 C500 270 600 400 700 560 Z" fill="#ffffff" stroke="#56608c" stroke-width="3"/><path d="M300 210 L520 470 L240 520 Z" fill="#1e9e62" fill-opacity="0.08" stroke="#1e9e62" stroke-width="4" stroke-linejoin="round"/><text x="0" y="0" font-size="20" fill="#1e9e62" font-weight="800" text-anchor="start" letter-spacing="0"></text><path d="M270 160 L560 470 L230 530 Z" fill="#ffb020" fill-opacity="0.06" stroke="#ffb020" stroke-width="4" stroke-linejoin="round"/><text x="0" y="0" font-size="20" fill="#ffb020" font-weight="800" text-anchor="start" letter-spacing="0"></text><path d="M280 230 L500 470 L250 510 Z" fill="#6b4aff" fill-opacity="0.12" stroke="#6b4aff" stroke-width="4" stroke-linejoin="round"/><text x="0" y="0" font-size="20" fill="#6b4aff" font-weight="800" text-anchor="start" letter-spacing="0"></text><path d="M300 280 L420 330 L470 450 L330 500 L265 470 Z" fill="none" stroke="#e03a7a" stroke-width="4" stroke-dasharray="10 8"/><text x="330" y="625" font-size="18" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">All visible colours</text></g><rect x="700" y="190" width="452" height="86" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="722" y="212" width="42" height="42" rx="10" fill="#6b4aff" stroke="#6b4aff" stroke-width="3"/><text x="784" y="228" font-size="22" fill="#1e066f" font-weight="750" text-anchor="start" letter-spacing="0">sRGB</text><text x="784" y="256" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Web, social, most screens</text><rect x="700" y="295" width="452" height="86" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="722" y="317" width="42" height="42" rx="10" fill="#ffb020" stroke="#ffb020" stroke-width="3"/><text x="784" y="333" font-size="22" fill="#1e066f" font-weight="750" text-anchor="start" letter-spacing="0">Display P3</text><text x="784" y="361" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Newer phones and laptops</text><rect x="700" y="400" width="452" height="86" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="722" y="422" width="42" height="42" rx="10" fill="#1e9e62" stroke="#1e9e62" stroke-width="3"/><text x="784" y="438" font-size="22" fill="#1e066f" font-weight="750" text-anchor="start" letter-spacing="0">Adobe RGB</text><text x="784" y="466" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Photography for print</text><rect x="700" y="505" width="452" height="86" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="722" y="527" width="42" height="42" rx="10" fill="#e03a7a" stroke="#e03a7a" stroke-width="3"/><text x="784" y="543" font-size="22" fill="#1e066f" font-weight="750" text-anchor="start" letter-spacing="0">CMYK (e.g. FOGRA)</text><text x="784" y="571" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Commercial print, depends on press</text></g></svg>