<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Taste vs process"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Taste vs process</text><rect x="48" y="120" width="536" height="510" rx="20" fill="#ffffff" stroke="#1e066f" stroke-width="3"/><rect x="72" y="140" width="74.5" height="30" rx="15" fill="#e9edfc" stroke="#e9edfc" stroke-width="2"/><text x="109.25" y="160.7" font-size="15" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">TASTE</text><text x="78" y="230" font-size="26" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">•</text><text x="118" y="230.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Novel problems</text><text x="78" y="308" font-size="26" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">•</text><text x="118" y="308.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Brand feeling</text><text x="78" y="386" font-size="26" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">•</text><text x="118" y="386.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Final polish</text><text x="78" y="464" font-size="26" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">•</text><text x="118" y="464.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Fails when tired or rushed</text><rect x="616" y="120" width="536" height="510" rx="20" fill="#ffffff" stroke="#6b4aff" stroke-width="3"/><rect x="640" y="140" width="93.1" height="30" rx="15" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="686.