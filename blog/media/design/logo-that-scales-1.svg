<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Responsive logo ladder"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">A responsive logo ladder</text><rect x="60" y="200" width="440" height="300" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="160.0" cy="330" r="48.0" fill="#6b4aff" stroke="none" stroke-width="0"/><path d="M137.6 349.2 L160.0 304.4 L182.4 349.2" fill="none" stroke="#d4ff24" stroke-width="11.200000000000001" stroke-linejoin="round" stroke-linecap="round"/><text x="250.0" y="340" font-size="54.400000000000006" fill="#1e066f" font-weight="900" text-anchor="start" letter-spacing="0">Nodi</text><text x="90" y="420" font-size="20" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">Signals, made simple</text><text x="280.0" y="550" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Full lockup</text><rect x="524" y="200" width="320" height="300" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="604.0" cy="330" r="36.0" fill="#6b4aff" stroke="none" stroke-width="0"/><path d="M587.2 344.4 L604.0 310.8 L620.8 344.4" fill="none" stroke="#d4ff24" stroke-width="8.4" stroke-linejoin="round" stroke-linecap="round"/><text x="674.0" y="340" font-size="40.8" fill="#1e066f" font-weight="900" text-anchor="start" letter-spacing="0">Nodi</text><text x="684.0" y="550" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Primary</text><rect x="868" y="200" width="160" height="300" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="938" cy="330" r="30" fill="#6b4aff" stroke="none" stroke-width="0"/><path d="M924 342 L938 314 L952 342" fill="none" stroke="#d4ff24" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="948.0" y="550" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Compact</text><rect x="1052" y="200" width="110" height="300" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="1097.0" cy="330" r="15.0" fill="#6b4aff" stroke="none" stroke-width="0"/><path d="M1090.0 336.0 L1097.0 322.0 L1104.0 336.0" fill="none" stroke="#d4ff24" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1107.0" y="550" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Micro (16–32 px)</text><text x="600" y="620" font-size="21" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="0">Each level is drawn for its size, not just shrunk.</text></g></svg>