<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cultural colour meanings"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Same colour, different meanings</text><text x="310" y="145" font-size="16" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Cascadia Mono, Consolas, Menlo, monospace">BANGLADESH</text><text x="780" y="145" font-size="16" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Cascadia Mono, Consolas, Menlo, monospace">ELSEWHERE (EXAMPLES)</text><rect x="48" y="165" width="210" height="100" rx="16" fill="#ffffff" stroke="#1e066f" stroke-width="2"/><text x="70" y="225" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">White</text><rect x="290" y="165" width="440" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="310" y="207.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Purity; also mourning in parts of South</text><text x="310" y="232.65" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Asia</text><rect x="760" y="165" width="392" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="780" y="207.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Weddings in many Western contexts</text><rect x="48" y="280" width="210" height="100" rx="16" fill="#d7263d" stroke="#d7263d" stroke-width="2"/><text x="70" y="340" font-size="24" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0">Red</text><rect x="290" y="280" width="440" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="310" y="322.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Pohela Boishakh with white; the flag</text><text x="310" y="347.65" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">with green</text><rect x="760" y="280" width="392" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="780" y="322.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Luck in China; danger or love in the</text><text x="780" y="347.65" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">West</text><rect x="48" y="395" width="210" height="100" rx="16" fill="#1f8a4c" stroke="#1f8a4c" stroke-width="2"/><text x="70" y="455" font-size="24" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0">Green</text><rect x="290" y="395" width="440" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="310" y="437.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">National flag, nature; for many, Islam</text><rect x="760" y="395" width="392" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="780" y="437.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Nature, money (US), health</text><rect x="48" y="510" width="210" height="100" rx="16" fill="#f2b705" stroke="#f2b705" stroke-width="2"/><text x="70" y="570" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Yellow</text><rect x="290" y="510" width="440" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="310" y="552.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Turmeric, gaye holud</text><rect x="760" y="510" width="392" height="100" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="780" y="552.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Optimism; caution signs</text></g></svg>