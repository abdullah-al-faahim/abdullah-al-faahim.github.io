<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Calm is preparation"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Calm is preparation</text><rect x="48.0" y="120.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="82.0" cy="158.0" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="82.0" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="110.0" y="166.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">First ten seconds</text><text x="72.0" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Your tone sets everyone else&#x27;s.</text><rect x="422.6666666666667" y="120.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="456.6666666666667" cy="158.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="456.6666666666667" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="484.6666666666667" y="166.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Lower your voice</text><text x="446.6666666666667" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">As the stakes go up.</text><rect x="797.3333333333334" y="120.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="831.3333333333334" cy="158.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="831.3333333333334" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="859.3333333333334" y="166.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Fix, then blame-free review</text><text x="821.3333333333334" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Keep them separate.</text><rect x="48.0" y="390.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="82.0" cy="428.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="82.0" y="435.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="110.0" y="436.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Boring normal</text><text x="72.0" y="476.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Routines make calm possible.</text><rect x="422.6666666666667" y="390.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="456.6666666666667" cy="428.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="456.6666666666667" y="435.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="484.6666666666667" y="436.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Look after people</text><text x="446.6666666666667" y="476.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Not just the signal.</text><rect x="797.3333333333334" y="390.0" width="354.6666666666667" height="250.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="831.3333333333334" cy="428.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="831.3333333333334" y="435.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">6</text><text x="859.3333333333334" y="436.0" font-size="21" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Practise</text><text x="821.3333333333334" y="476.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Calm comes from rehearsal.</text></g></svg>