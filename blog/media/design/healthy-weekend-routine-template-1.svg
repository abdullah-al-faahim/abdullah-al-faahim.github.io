<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A weekend routine template"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">A weekend routine template</text><rect x="48" y="125" width="1104" height="350" rx="16" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="48" y="125" width="1104" height="70" rx="16" fill="#e9edfc"/><text x="64" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">WHEN</text><text x="264" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">FRIDAY</text><text x="716" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">SATURDAY</text><line x1="58" y1="195" x2="1142" y2="195" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="239.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Morning</text><text x="264" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">No phone, daylight, breakfast, reading</text><text x="716" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Exercise, then one hour of chores</text><line x1="58" y1="265" x2="1142" y2="265" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="309.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Midday</text><text x="264" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Jumu&#x27;ah and family lunch</text><text x="716" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Cook together or a hobby</text><line x1="58" y1="335" x2="1142" y2="335" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="379.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Afternoon</text><text x="264" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Rest, then a walk or sport</text><text x="716" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Free, unplanned time</text><line x1="58" y1="405" x2="1142" y2="405" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="449.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Evening</text><text x="264" y="449.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Friends or family, screens away</text><text x="716" y="449.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">20-minute plan, early night</text></g></svg>