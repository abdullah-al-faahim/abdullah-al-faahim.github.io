<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Brand shown in five logo types"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">One brand, five options</text><text x="48" y="108" font-size="20" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Invented brand: Dhaka Bean Roasters</text><rect x="48" y="150" width="204" height="440" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(150 300)"><text x="0" y="10" font-size="20" fill="#1e066f" font-weight="900" text-anchor="middle" letter-spacing="0">Dhaka Bean Roasters</text></g><text x="150" y="450" font-size="21" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Wordmark</text><text x="150" y="490.0" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Hard to read small</text><rect x="272" y="150" width="204" height="440" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(374 300)"><text x="0" y="16" font-size="40" fill="#1e066f" font-weight="900" text-anchor="middle" letter-spacing="0">DBR</text></g><text x="374" y="450" font-size="21" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Lettermark</text><text x="374" y="490.0" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Means nothing yet</text><rect x="496" y="150" width="204" height="440" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(598 300)"><ellipse cx="0" cy="0" rx="30" ry="42" fill="#6b3e26" transform="rotate(25 0 0)"/><path d="M-6 -36 C14 -10 -16 10 6 36" fill="none" stroke="#f3e3cf" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="598" y="450" font-size="21" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Symbol</text><text x="598" y="490.0" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Doesn&#x27;t say the</text><text x="598" y="511.6" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">name</text><rect x="720" y="150" width="204" height="440" rx="18" fill="#d4ff24" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(822 300)"><ellipse cx="-62" cy="0" rx="21.0" ry="29.4" fill="#6b3e26" transform="rotate(25 -62 0)"/><path d="M-66.2 -25.2 C-52.2 -7.0 -73.2 7.0 -57.8 25.2" fill="none" stroke="#f3e3cf" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="-25" y="-2" font-size="18" fill="#1e066f" font-weight="900" text-anchor="start" letter-spacing="0">Dhaka Bean</text><text x="-25" y="22" font-size="18" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="0">Roasters</text></g><text x="822" y="450" font-size="21" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Combination</text><text x="822" y="490.0" font-size="16" fill="#1e066f" font-weight="600" text-anchor="middle" letter-spacing="0">Flexible: bean</text><text x="822" y="511.6" font-size="16" fill="#1e066f" font-weight="600" text-anchor="middle" letter-spacing="0">stands alone</text><rect x="944" y="150" width="204" height="440" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(1046 300)"><circle cx="0" cy="0" r="62" fill="#6b3e26" stroke="none" stroke-width="0"/><circle cx="0" cy="0" r="52" fill="none" stroke="#f3e3cf" stroke-width="2"/><text x="0" y="6" font-size="13" fill="#f3e3cf" font-weight="800" text-anchor="middle" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">DHAKA BEAN</text></g><text x="1046" y="450" font-size="21" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Emblem</text><text x="1046" y="490.0" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Needs a small</text><text x="1046" y="511.6" font-size="16" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">version</text></g></svg>