<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="N+1 or 2N?"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">N+1 or 2N?</text><rect x="48" y="125" width="1104" height="350" rx="16" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="48" y="125" width="1104" height="70" rx="16" fill="#e9edfc"/><text x="64" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">SITUATION</text><text x="664" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">USUALLY SENSIBLE</text><rect x="52" y="198" width="1096" height="64" rx="10" fill="#d4ff24" opacity=".55"/><line x1="58" y1="195" x2="1142" y2="195" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="239.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Channel off air, slow manual fix</text><text x="664" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">2N / 1+1 hot standby</text><line x1="58" y1="265" x2="1142" y2="265" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="309.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Many identical units, short outage OK</text><text x="664" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">N+1, automatic switching</text><line x1="58" y1="335" x2="1142" y2="335" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="379.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">One feature affected</text><text x="664" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Cold spare + procedure</text><line x1="58" y1="405" x2="1142" y2="405" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="449.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Rare failure, fast manual fix</text><text x="664" y="449.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Spares on site + training</text></g></svg>