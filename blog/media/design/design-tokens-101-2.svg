<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Figma variables and CSS custom properties"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Same tokens in Figma and CSS</text><text x="48" y="108" font-size="20" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Simplified drawing of a variables panel</text><rect x="48" y="140" width="520" height="470" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="72" y="182" font-size="20" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Variables · Tokens</text><text x="400" y="182" font-size="16" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="0">Light</text><text x="480" y="182" font-size="16" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="0">Dark</text><line x1="64" y1="210" x2="552" y2="210" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="255" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">color/primary</text><rect x="400" y="232" width="34" height="34" rx="8" fill="#6b4aff" stroke="#1e066f" stroke-width="1"/><rect x="480" y="232" width="34" height="34" rx="8" fill="#9a86ff" stroke="#1e066f" stroke-width="1"/><line x1="64" y1="284" x2="552" y2="284" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="329" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">color/ink</text><rect x="400" y="306" width="34" height="34" rx="8" fill="#1e066f" stroke="#1e066f" stroke-width="1"/><rect x="480" y="306" width="34" height="34" rx="8" fill="#f0eeff" stroke="#1e066f" stroke-width="1"/><line x1="64" y1="358" x2="552" y2="358" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="403" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">color/surface</text><rect x="400" y="380" width="34" height="34" rx="8" fill="#ffffff" stroke="#1e066f" stroke-width="1"/><rect x="480" y="380" width="34" height="34" rx="8" fill="#1c1640" stroke="#1e066f" stroke-width="1"/><line x1="64" y1="432" x2="552" y2="432" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="477" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">space/4</text><text x="400" y="477" font-size="18" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">16</text><text x="480" y="477" font-size="18" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">16</text><line x1="64" y1="506" x2="552" y2="506" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="551" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">radius/card</text><text x="400" y="551" font-size="18" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">16</text><text x="480" y="551" font-size="18" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">16</text><rect x="600" y="140" width="552" height="470" rx="18" fill="#0b0524" stroke="#0b0524" stroke-width="3"/><text x="630" y="185" font-size="19" fill="#e9e7ff" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">:root {</text><text x="630" y="223" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --color-primary: #6b4aff;</text><text x="630" y="261" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --color-ink: #1e066f;</text><text x="630" y="299" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --color-surface: #ffffff;</text><text x="630" y="337" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --space-4: 16px;</text><text x="630" y="375" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --radius-card: 16px;</text><text x="630" y="413" font-size="19" fill="#e9e7ff" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">}</text><text x="630" y="451" font-size="19" fill="#e9e7ff" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">[data-theme=dark] {</text><text x="630" y="489" font-size="19" fill="#d4ff24" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  --color-primary: #9a86ff;</text><text x="630" y="527" font-size="19" fill="#e9e7ff" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">  ...</text><text x="630" y="565" font-size="19" fill="#e9e7ff" font-weight="500" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">}</text></g></svg>