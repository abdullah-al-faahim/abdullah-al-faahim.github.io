<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Rest, connect, grow"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Rest, connect, grow</text><rect x="48.0" y="120.0" width="261.0" height="520.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="82.0" cy="158.0" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="82.0" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="110.0" y="166.0" font-size="19" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Rest</text><text x="72.0" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Sleep, slow breakfast, a</text><text x="72.0" y="228.95" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">walk. Nothing to achieve.</text><rect x="329.0" y="120.0" width="261.0" height="520.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="363.0" cy="158.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="363.0" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="391.0" y="166.0" font-size="19" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Connect</text><text x="353.0" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Family lunch, friends, a</text><text x="353.0" y="228.95" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">call home.</text><rect x="610.0" y="120.0" width="261.0" height="520.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="644.0" cy="158.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="644.0" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="672.0" y="166.0" font-size="19" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Grow</text><text x="634.0" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Reading, a hobby, exercise,</text><text x="634.0" y="228.95" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">cooking.</text><rect x="891.0" y="120.0" width="261.0" height="520.0" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><circle cx="925.0" cy="158.0" r="17" fill="#e9edfc" stroke="#1e066f" stroke-width="2"/><text x="925.0" y="165.0" font-size="17" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="953.0" y="166.0" font-size="19" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Admin (one hour)</text><text x="915.0" y="206.0" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Chores in a fixed block, not</text><text x="915.0" y="228.95" font-size="17" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">all day.</text></g></svg>