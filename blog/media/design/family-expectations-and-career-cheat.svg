<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="&quot;Why Not a Government Job?&quot; cheat sheet"><rect width="1200" height="628" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">&quot;Why Not a Government Job?&quot;</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Family pressure in Bangladesh includes time, care, career</text><text x="100" y="212" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">opinions and money.</text><circle cx="66" cy="262" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="269" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="270" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Share your calendar and plan family time on purpose.</text><circle cx="66" cy="320" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="327" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="328" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Choose which events to attend, and share care responsibilities</text><text x="100" y="360" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">openly.</text><circle cx="66" cy="410" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="417" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="418" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Respond to career opinions by listening, explaining and</text><text x="100" y="450" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">sharing your plan.</text><circle cx="66" cy="500" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="507" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="508" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Protect some rest for yourself, and ask your manager for</text><text x="100" y="540" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">flexibility early.</text><text x="1152" y="600" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>