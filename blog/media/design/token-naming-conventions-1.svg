<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Token naming pyramid"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Three naming layers</text><rect x="390.0" y="150" width="420" height="120" rx="18" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="600" y="200" font-size="26" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Component</text><text x="600" y="238" font-size="18" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">button-primary-background</text><rect x="240.0" y="300" width="720" height="120" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="2"/><text x="600" y="350" font-size="26" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Semantic</text><text x="600" y="388" font-size="18" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">color-action-primary · color-text-default</text><rect x="90.0" y="450" width="1020" height="120" rx="18" fill="#e9edfc" stroke="#d6dcf5" stroke-width="2"/><text x="600" y="500" font-size="26" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Primitive</text><text x="600" y="538" font-size="18" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">violet-500 · grey-200 · space-4</text><text x="600" y="625" font-size="20" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="0">Components use semantic (or component) tokens, never primitives.</text></g></svg>