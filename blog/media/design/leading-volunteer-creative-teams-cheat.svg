<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Leading Volunteer Creative Teams cheat sheet"><rect width="1200" height="532" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Leading Volunteer Creative Teams</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Start with why the work matters.</text><circle cx="66" cy="230" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="237" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="238" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Make work visible on one shared board.</text><circle cx="66" cy="288" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="295" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="296" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Use a design system as a leadership tool.</text><circle cx="66" cy="346" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="353" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="354" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Give clear briefs, then trust people.</text><circle cx="66" cy="404" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="411" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="412" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Plan backwards from the event, prevent burnout and build the</text><text x="100" y="444" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">next leaders.</text><text x="1152" y="504" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>