<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Where Did Tanvir&#x27;s Salary Go? cheat sheet"><rect width="1200" height="532" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Where Did Tanvir&#x27;s Salary Go?</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Money stress affects focus, sleep and relationships.</text><circle cx="66" cy="230" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="237" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="238" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Track every expense for a month.</text><circle cx="66" cy="288" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="295" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="296" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Split income into needs, savings and wants, and save something</text><text x="100" y="328" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">every month.</text><circle cx="66" cy="378" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="385" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="386" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Build an emergency fund and pay yourself first.</text><circle cx="66" cy="436" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="443" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="444" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Talk openly about money with family, managers and experts.</text><text x="1152" y="504" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>