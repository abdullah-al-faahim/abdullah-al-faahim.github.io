<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Golden ratio diagrams"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">The golden ratio, about 1.618</text><line x1="80" y1="200" x2="560" y2="200" stroke="#1e066f" stroke-width="6" stroke-linecap="round"/><line x1="377" y1="185" x2="377" y2="215" stroke="#ff3b5c" stroke-width="4" stroke-linecap="round"/><text x="228" y="180" font-size="22" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="0">a</text><text x="468" y="180" font-size="22" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="0">b</text><text x="320" y="250" font-size="22" fill="#6b4aff" font-weight="800" text-anchor="middle" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">(a + b) / a = a / b ≈ 1.618</text><rect x="80" y="300" width="480" height="297" rx="0" fill="#ffffff" stroke="#1e066f" stroke-width="3"/><line x1="377" y1="300" x2="377" y2="597" stroke="#1e066f" stroke-width="2" stroke-linecap="round"/><line x1="377" y1="483" x2="560" y2="483" stroke="#1e066f" stroke-width="2" stroke-linecap="round"/><path d="M80 597 A297 297 0 0 1 377 300 A183 183 0 0 1 560 483 A114 114 0 0 1 446 597" fill="none" stroke="#6b4aff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="653.65" cy="450" r="13.65" fill="none" stroke="#1e066f" stroke-width="2"/><circle cx="701.3499999999999" cy="450" r="22.05" fill="none" stroke="#1e066f" stroke-width="2"/><circle cx="771.1" cy="450" r="35.7" fill="none" stroke="#1e066f" stroke-width="2"/><circle cx="876.55" cy="450" r="57.75" fill="none" stroke="#1e066f" stroke-width="2"/><circle cx="1039.75" cy="450" r="93.45" fill="none" stroke="#6b4aff" stroke-width="2"/><text x="880" y="620" font-size="18" fill="#56608c" font-weight="600" text-anchor="middle" letter-spacing="0">Circles in Fibonacci proportions: 13, 21, 34, 55, 89</text></g></svg>