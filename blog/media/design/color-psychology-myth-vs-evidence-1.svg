<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Colour psychology myths and evidence"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Evidence or folklore?</text><rect x="48" y="120" width="540" height="510" rx="20" fill="#ffffff" stroke="#19b36b" stroke-width="3"/><rect x="612" y="120" width="540" height="510" rx="20" fill="#ffffff" stroke="#ff3b5c" stroke-width="3"/><rect x="72" y="140" width="223.3" height="30" rx="15" fill="#19b36b" stroke="#19b36b" stroke-width="2"/><text x="183.65" y="160.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">SUPPORTED BY RESEARCH</text><rect x="636" y="140" width="167.5" height="30" rx="15" fill="#ff3b5c" stroke="#ff3b5c" stroke-width="2"/><text x="719.75" y="160.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">MOSTLY FOLKLORE</text><text x="80" y="240" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="118" y="240.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Colour shapes first impressions</text><text x="644" y="240" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="682" y="240.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Fixed, universal colour meanings</text><text x="80" y="332" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="118" y="332.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Fit with brand personality matters</text><text x="644" y="332" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="682" y="332.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Exact % lifts from one colour</text><text x="80" y="424" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="118" y="424.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Many meanings are learned,</text><text x="118" y="452.35" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">cultural</text><text x="644" y="424" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="682" y="424.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Personality from favourite colour</text><text x="80" y="516" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="118" y="516.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Distinctiveness aids recognition</text><text x="644" y="516" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="682" y="516.0" font-size="21" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Same meaning in every market</text></g></svg>