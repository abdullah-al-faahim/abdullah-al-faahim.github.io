<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Words versus a Pantone code"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="90" width="536" height="545" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(56 140)"><rect x="30" y="60" width="140" height="200" rx="12" fill="#2346b8" stroke="#2346b8" stroke-width="0"/><text x="100" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 1</text><rect x="190" y="60" width="140" height="200" rx="12" fill="#2d5fe0" stroke="#2d5fe0" stroke-width="0"/><text x="260" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 2</text><rect x="350" y="60" width="140" height="200" rx="12" fill="#1d3a8f" stroke="#1d3a8f" stroke-width="0"/><text x="420" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 3</text><text x="30" y="350.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">“Bright royal blue” gives three different</text><text x="30" y="375.65" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">blues.</text></g><rect x="68" y="104" width="195.4" height="30" rx="15" fill="#ff3b5c" stroke="#ff3b5c" stroke-width="2"/><text x="165.7" y="124.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">DESCRIBED IN WORDS</text><rect x="616" y="90" width="536" height="545" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(624 140)"><rect x="30" y="60" width="140" height="200" rx="12" fill="#2a5cd6" stroke="#2a5cd6" stroke-width="0"/><text x="100" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 1</text><rect x="190" y="60" width="140" height="200" rx="12" fill="#2b5dd7" stroke="#2b5dd7" stroke-width="0"/><text x="260" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 2</text><rect x="350" y="60" width="140" height="200" rx="12" fill="#295bd4" stroke="#295bd4" stroke-width="0"/><text x="420" y="290" font-size="16" fill="#56608c" font-weight="700" text-anchor="middle" letter-spacing="0">Printer 3</text><text x="30" y="350.0" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">A shared code gives the same target to every</text><text x="30" y="375.65" font-size="19" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">printer.</text></g><rect x="636" y="104" width="186.1" height="30" rx="15" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="729.05" y="124.7" font-size="15" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">SPECIFIED BY CODE</text></g></svg>