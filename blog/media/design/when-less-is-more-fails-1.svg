<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Visual simplicity versus usability"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Looks clean vs easy to use</text><path d="M600 520 L540 600 H660 Z" fill="#1e066f" stroke="#1e066f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-8 600 300)"><rect x="200" y="290" width="800" height="22" rx="11" fill="#1e066f" stroke="#1e066f" stroke-width="0"/><rect x="220" y="160" width="300" height="120" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="370" y="210" font-size="26" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Looks clean</text><text x="370" y="248" font-size="18" fill="#56608c" font-weight="500" text-anchor="middle" letter-spacing="0">No labels, pale text</text><rect x="680" y="160" width="300" height="120" rx="18" fill="#d4ff24" stroke="#1e066f" stroke-width="3"/><text x="830" y="210" font-size="26" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">Easy to use</text><text x="830" y="248" font-size="18" fill="#1e066f" font-weight="500" text-anchor="middle" letter-spacing="0">Labels, contrast, visible</text></g><line x1="600" y1="312" x2="600" y2="520" stroke="#1e066f" stroke-width="8" stroke-linecap="round"/><text x="600" y="650" font-size="22" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="0">Good design keeps both sides: clean structure, clear information.</text></g></svg>