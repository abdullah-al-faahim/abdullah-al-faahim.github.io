<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 596" width="1200" height="596" role="img" aria-label="Nusrat&#x27;s Work-From-Home Days Never Ended cheat sheet"><rect width="1200" height="596" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Nusrat&#x27;s Work-From-Home Days Never Ended</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Without structure, working from home stretches into the</text><text x="100" y="212" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">evening.</text><circle cx="66" cy="262" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="269" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="270" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Create one work spot with a good chair, light and backup</text><text x="100" y="302" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">power.</text><circle cx="66" cy="352" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="359" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="360" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Start with a routine and plan your top three tasks.</text><circle cx="66" cy="410" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="417" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="418" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Agree quiet hours with your family and take real breaks.</text><circle cx="66" cy="468" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="475" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="476" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">End each day with a ritual, and stay connected with</text><text x="100" y="508" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">colleagues.</text><text x="1152" y="568" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>