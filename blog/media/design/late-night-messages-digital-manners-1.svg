<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Digital manners at work"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Digital manners at work</text><rect x="48" y="125" width="1104" height="490" rx="16" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="48" y="125" width="1104" height="70" rx="16" fill="#e9edfc"/><text x="64" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">AVOID</text><text x="616" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">INSTEAD</text><line x1="58" y1="195" x2="1142" y2="195" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="239.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Work messages after 9 p.m.</text><text x="616" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Schedule for the morning</text><line x1="58" y1="265" x2="1142" y2="265" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="309.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Long voice notes</text><text x="616" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Short written messages</text><line x1="58" y1="335" x2="1142" y2="335" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="379.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Personal posts in work groups</text><text x="616" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">A separate social group</text><line x1="58" y1="405" x2="1142" y2="405" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="449.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Tagging everyone</text><text x="616" y="449.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Message the right person</text><line x1="58" y1="475" x2="1142" y2="475" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="519.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Leaving messages on &#x27;seen&#x27;</text><text x="616" y="519.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">A quick acknowledgement</text><line x1="58" y1="545" x2="1142" y2="545" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="589.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Decisions only in chat</text><text x="616" y="589.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Confirm by email or document</text></g></svg>