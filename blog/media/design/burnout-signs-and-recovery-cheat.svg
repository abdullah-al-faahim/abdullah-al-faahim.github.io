<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 596" width="1200" height="596" role="img" aria-label="Kabir Bhai Stopped Laughing cheat sheet"><rect width="1200" height="596" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Kabir Bhai Stopped Laughing</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Burnout is chronic workplace stress, not ordinary tiredness.</text><circle cx="66" cy="230" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="237" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="238" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">The WHO describes exhaustion, mental distance and reduced</text><text x="100" y="270" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">effectiveness.</text><circle cx="66" cy="320" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="327" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="328" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Causes include heavy workload, little control and too little</text><text x="100" y="360" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">recognition.</text><circle cx="66" cy="410" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="417" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="418" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Recovery needs support, a lighter load, health basics and real</text><text x="100" y="450" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">rest.</text><circle cx="66" cy="500" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="507" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="508" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Seek professional help if you feel persistently low or unwell.</text><text x="1152" y="568" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>