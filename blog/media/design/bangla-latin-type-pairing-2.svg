<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Bangla Latin pairing before and after"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="90" width="536" height="545" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(56 140)"><text x="30" y="110" font-size="40" fill="#1e066f" font-weight="900" text-anchor="start" letter-spacing="0">New beginning</text><text x="30" y="180" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="40" fill="#1e066f" font-weight="300" text-anchor="start">নতুন শুরু</text><text x="30" y="240" font-size="17" fill="#ff3b5c" font-weight="600" text-anchor="start" letter-spacing="0">Same size, mismatched weight;</text><text x="30" y="266" font-size="17" fill="#ff3b5c" font-weight="600" text-anchor="start" letter-spacing="0">Bangla looks smaller and thinner.</text><text x="30" y="330" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">Body text with tight line height</text><text x="30" y="362" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="20" fill="#1e066f" font-weight="500" text-anchor="start">বাংলা লেখার জন্য বেশি জায়গা দরকার</text><text x="30" y="384" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="20" fill="#1e066f" font-weight="500" text-anchor="start">উপরে ও নিচে চিহ্ন থাকে</text></g><rect x="68" y="104" width="167.5" height="30" rx="15" fill="#ff3b5c" stroke="#ff3b5c" stroke-width="2"/><text x="151.75" y="124.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">SAME POINT SIZE</text><rect x="616" y="90" width="536" height="545" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><g transform="translate(624 140)"><text x="30" y="110" font-size="40" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">New beginning</text><text x="30" y="185" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="46" fill="#1e066f" font-weight="700" text-anchor="start">নতুন শুরু</text><text x="30" y="240" font-size="17" fill="#19b36b" font-weight="600" text-anchor="start" letter-spacing="0">Bangla set larger, weights matched;</text><text x="30" y="266" font-size="17" fill="#19b36b" font-weight="600" text-anchor="start" letter-spacing="0">the two lines feel equal.</text><text x="30" y="330" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">Body text with 1.6 line height</text><text x="30" y="364" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="20" fill="#1e066f" font-weight="500" text-anchor="start">বাংলা লেখার জন্য বেশি জায়গা দরকার</text><text x="30" y="400" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, Shonar Bangla, sans-serif" font-size="20" fill="#1e066f" font-weight="500" text-anchor="start">উপরে ও নিচে চিহ্ন থাকে</text></g><rect x="636" y="104" width="176.8" height="30" rx="15" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="724.4" y="124.7" font-size="15" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">MATCHED VISUALLY</text></g></svg>