<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Design system layers"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Five layers of a design system</text><rect x="280.0" y="130" width="640" height="84" rx="18" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="310.0" y="182" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Governance</text><text x="890.0" y="182" font-size="18" fill="#56608c" font-weight="600" text-anchor="end" letter-spacing="0">Who owns it, how it changes</text><rect x="225.0" y="230" width="750" height="84" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="2"/><text x="255.0" y="282" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Documentation</text><text x="945.0" y="282" font-size="18" fill="#56608c" font-weight="600" text-anchor="end" letter-spacing="0">When and why to use things</text><rect x="170.0" y="330" width="860" height="84" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="2"/><text x="200.0" y="382" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Components</text><text x="1000.0" y="382" font-size="18" fill="#56608c" font-weight="600" text-anchor="end" letter-spacing="0">Buttons, inputs, cards, in design and code</text><rect x="115.0" y="430" width="970" height="84" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="2"/><text x="145.0" y="482" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Design tokens</text><text x="1055.0" y="482" font-size="18" fill="#56608c" font-weight="600" text-anchor="end" letter-spacing="0">Named colour, type, spacing values</text><rect x="60.0" y="530" width="1080" height="84" rx="18" fill="#6b4aff" stroke="#6b4aff" stroke-width="2"/><text x="90.0" y="582" font-size="24" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0">Principles</text><text x="1110.0" y="582" font-size="18" fill="#e6e0ff" font-weight="600" text-anchor="end" letter-spacing="0">How the product should feel</text></g></svg>