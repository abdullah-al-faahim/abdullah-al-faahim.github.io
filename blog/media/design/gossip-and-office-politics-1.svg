<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Gossip vs healthy conversation"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Gossip vs healthy conversation</text><rect x="48" y="120" width="536" height="510" rx="20" fill="#ffffff" stroke="#ff3b5c" stroke-width="3"/><rect x="72" y="140" width="83.8" height="30" rx="15" fill="#ff3b5c" stroke="#ff3b5c" stroke-width="2"/><text x="113.9" y="160.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">GOSSIP</text><text x="78" y="230" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="118" y="230.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">About someone who isn&#x27;t there</text><text x="78" y="308" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="118" y="308.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Half-true or unfair</text><text x="78" y="386" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="118" y="386.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Changes nothing</text><text x="78" y="464" font-size="26" fill="#ff3b5c" font-weight="800" text-anchor="start" letter-spacing="0">✕</text><text x="118" y="464.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Damages trust</text><rect x="616" y="120" width="536" height="510" rx="20" fill="#ffffff" stroke="#19b36b" stroke-width="3"/><rect x="640" y="140" width="93.1" height="30" rx="15" fill="#19b36b" stroke="#19b36b" stroke-width="2"/><text x="686.55" y="160.7" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">HEALTHY</text><text x="646" y="230" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="686" y="230.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">You&#x27;d say it to their face</text><text x="646" y="308" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="686" y="308.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">True and fair</text><text x="646" y="386" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="686" y="386.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Aims to solve a problem</text><text x="646" y="464" font-size="26" fill="#19b36b" font-weight="800" text-anchor="start" letter-spacing="0">✓</text><text x="686" y="464.0" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Builds trust</text></g></svg>