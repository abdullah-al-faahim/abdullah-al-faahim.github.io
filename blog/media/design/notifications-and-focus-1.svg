<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Sorting your notifications"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Sorting your notifications</text><rect x="48" y="125" width="1104" height="280" rx="16" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="48" y="125" width="1104" height="70" rx="16" fill="#e9edfc"/><text x="64" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">GROUP</text><text x="264" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">EXAMPLES</text><text x="824" y="169.1" font-size="14" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">WHAT TO DO</text><line x1="58" y1="195" x2="1142" y2="195" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="239.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Keep</text><text x="264" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Calls, family messages, calendar, bank alerts</text><text x="824" y="239.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Leave on</text><line x1="58" y1="265" x2="1142" y2="265" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="309.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Batch</text><text x="264" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Email, work chat, news</text><text x="824" y="309.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Check at set times</text><line x1="58" y1="335" x2="1142" y2="335" stroke="#d6dcf5" stroke-width="2" stroke-linecap="round"/><text x="64" y="379.1" font-size="19" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Switch off</text><text x="264" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Likes, shopping, games, promotions</text><text x="824" y="379.1" font-size="19" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Turn off completely</text></g></svg>