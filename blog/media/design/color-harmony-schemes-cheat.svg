<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="From Colour Wheel to Colour Strategy cheat sheet"><rect width="1200" height="654" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">From Colour Wheel to Colour Strategy</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Complementary: high contrast and energy.</text><circle cx="66" cy="230" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="237" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="238" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Analogous: calm and natural; add contrast through lightness.</text><circle cx="66" cy="288" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="295" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="296" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Triadic and tetradic: lively and rich, but let one colour</text><text x="100" y="328" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">dominate.</text><circle cx="66" cy="378" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="385" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="386" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Split-complementary: contrast with less tension.</text><circle cx="66" cy="436" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="443" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="444" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Monochrome: elegant and consistent; needs strong value</text><text x="100" y="476" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">contrast.</text><circle cx="66" cy="526" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="533" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">6</text><text x="100" y="534" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Choose a scheme from the brand&#x27;s feeling, then test on real</text><text x="100" y="566" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">layouts.</text><text x="1152" y="626" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>