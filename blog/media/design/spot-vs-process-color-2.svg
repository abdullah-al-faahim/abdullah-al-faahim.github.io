<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Spot and process business cards"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">One-colour spot card vs four-colour card</text><text x="48" y="108" font-size="20" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Relative cost and accuracy, not real prices</text><rect x="48" y="140" width="340" height="200" rx="10" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="72" y="200" font-size="26" fill="#1f6fd1" font-weight="800" text-anchor="start" letter-spacing="0">Rafi Hasan</text><text x="72" y="232" font-size="17" fill="#1f6fd1" font-weight="600" text-anchor="start" letter-spacing="0">Brand Designer</text><rect x="72" y="280" width="120" height="8" rx="4" fill="#1f6fd1" stroke="none" stroke-width="0"/><text x="48" y="380" font-size="20" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">1 spot ink</text><rect x="420" y="140" width="340" height="200" rx="10" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><rect x="420" y="140" width="140" height="200" rx="10" fill="#7a9cc6" stroke="none" stroke-width="0"/><circle cx="490" cy="220" r="36" fill="#f2d1b3" stroke="none" stroke-width="0"/><text x="584" y="200" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Rafi Hasan</text><text x="584" y="232" font-size="16" fill="#56608c" font-weight="600" text-anchor="start" letter-spacing="0">Brand Designer</text><text x="420" y="380" font-size="20" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">CMYK (with photo)</text><text x="820" y="170" font-size="18" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="0">Cost</text><text x="820" y="300" font-size="18" fill="#56608c" font-weight="700" text-anchor="start" letter-spacing="0">Accuracy of brand colour</text><text x="820" y="200" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Spot only</text><rect x="950" y="186" width="76" height="18" rx="9" fill="#1f6fd1" stroke="none" stroke-width="1"/><text x="820" y="330" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">Spot only</text><rect x="950" y="316" width="190" height="18" rx="9" fill="#1f6fd1" stroke="none" stroke-width="1"/><text x="820" y="228" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">CMYK</text><rect x="950" y="214" width="114" height="18" rx="9" fill="#8f7eff" stroke="none" stroke-width="1"/><text x="820" y="358" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">CMYK</text><rect x="950" y="344" width="114" height="18" rx="9" fill="#8f7eff" stroke="none" stroke-width="1"/><text x="820" y="256" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">CMYK + spot</text><rect x="950" y="242" width="190" height="18" rx="9" fill="#d4ff24" stroke="#1e066f" stroke-width="1"/><text x="820" y="386" font-size="15" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">CMYK + spot</text><rect x="950" y="372" width="190" height="18" rx="9" fill="#d4ff24" stroke="#1e066f" stroke-width="1"/><rect x="48" y="450" width="1104" height="150" rx="18" fill="#ffffff" stroke="#d6dcf5" stroke-width="3"/><text x="76" y="500.0" font-size="22" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">No photos and one or two colours? Spot can be cheaper and more accurate. Photos plus a</text><text x="76" y="529.7" font-size="22" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">strict brand colour? CMYK + one spot.</text></g></svg>