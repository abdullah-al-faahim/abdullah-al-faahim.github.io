<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Mitu Wants to Learn the Guitar cheat sheet"><rect width="1200" height="532" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect x="48" y="40" width="137.12" height="32" rx="16" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="116.56" y="62.08" font-size="16" fill="#1e066f" font-weight="700" text-anchor="middle" letter-spacing="1" font-family="Cascadia Mono, Consolas, Menlo, monospace">CHEAT SHEET</text><text x="48" y="128" font-size="36" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Mitu Wants to Learn the Guitar</text><circle cx="66" cy="172" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="179" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="180" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Learning a new skill is a powerful kind of recovery.</text><circle cx="66" cy="230" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="237" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">2</text><text x="100" y="238" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Pick something different from your job that genuinely excites</text><text x="100" y="270" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">you.</text><circle cx="66" cy="320" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="327" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">3</text><text x="100" y="328" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Practise in short, playful sessions without big goals.</text><circle cx="66" cy="378" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="385" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">4</text><text x="100" y="386" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Use free resources and celebrate small wins.</text><circle cx="66" cy="436" r="17" fill="#d4ff24" stroke="#1e066f" stroke-width="2"/><text x="66" y="443" font-size="18" fill="#1e066f" font-weight="800" text-anchor="middle" letter-spacing="0">5</text><text x="100" y="444" font-size="23" fill="#1e066f" font-weight="500" text-anchor="start" letter-spacing="0">Learn with others, and keep at least part of it just for fun.</text><text x="1152" y="504" font-size="15" fill="#56608c" font-weight="500" text-anchor="end" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">abdullah-al-faahim.github.io/blog</text></g></svg>