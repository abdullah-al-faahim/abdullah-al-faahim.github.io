<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Coated and uncoated swatch comparison"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Same ink, two papers</text><text x="48" y="108" font-size="20" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Simulated; judge with printed swatches</text><rect x="48" y="130" width="536" height="400" rx="20" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0"/><rect x="616" y="130" width="536" height="400" rx="20" fill="#3e6aa8" stroke="#3e6aa8" stroke-width="0"/><rect x="616" y="130" width="536" height="400" rx="20" fill="url(#grain)" opacity=".25"/><defs><pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff"/></pattern></defs><text x="80" y="500" font-size="22" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">EXAMPLE 2935 C</text><text x="648" y="500" font-size="22" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0" font-family="Cascadia Mono, Consolas, Menlo, monospace">EXAMPLE 2935 U</text><text x="48" y="590" font-size="22" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Coated: crisp and vivid</text><text x="616" y="590" font-size="22" fill="#1e066f" font-weight="700" text-anchor="start" letter-spacing="0">Uncoated: flatter, slightly darker</text></g></svg>