<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="60-30-10 proportion bar"><rect width="1200" height="675" rx="28" fill="#f4f6ff"/><g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><text x="48" y="72" font-size="34" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Every colour gets a job</text><rect x="48" y="170" width="662" height="160" rx="20" fill="#1e066f"/><rect x="710" y="170" width="331" height="160" fill="#6b4aff"/><rect x="1041" y="170" width="111" height="160" rx="0" fill="#d4ff24"/><text x="80" y="270" font-size="56" fill="#ffffff" font-weight="900" text-anchor="start" letter-spacing="0">60%</text><text x="740" y="270" font-size="46" fill="#ffffff" font-weight="900" text-anchor="start" letter-spacing="0">30%</text><text x="1060" y="270" font-size="32" fill="#1e066f" font-weight="900" text-anchor="start" letter-spacing="0">10%</text><text x="48" y="380" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Dominant</text><text x="48" y="412.0" font-size="18" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Backgrounds, text, large</text><text x="48" y="436.3" font-size="18" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">areas</text><text x="710" y="380" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Secondary</text><text x="710" y="412.0" font-size="18" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Structure, headings, cards</text><text x="1041" y="380" font-size="24" fill="#1e066f" font-weight="800" text-anchor="start" letter-spacing="0">Accent</text><text x="1041" y="412.0" font-size="18" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">Calls to</text><text x="1041" y="436.3" font-size="18" fill="#56608c" font-weight="500" text-anchor="start" letter-spacing="0">action</text><text x="48" y="600" font-size="20" fill="#1e066f" font-weight="600" text-anchor="start" letter-spacing="0">A starting proportion, not a strict law. Squint test: the accent should catch your eye first.</text></g></svg>